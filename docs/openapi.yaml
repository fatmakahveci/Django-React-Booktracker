components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 140
        author:
          type: string
          maxLength: 140
        year:
          type: integer
          maximum: 9999
          minimum: 1
        finished:
          type: boolean
        isbn:
          type: string
          maxLength: 32
        cover_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        notes:
          type: string
          maxLength: 10000
        rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
        started_on:
          type: string
          format: date
          nullable: true
        finished_on:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - author
      - created_at
      - id
      - title
      - updated_at
      - user
      - year
    CSRF:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Email:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 150
      required:
      - email
    LinkToken:
      type: object
      properties:
        uid:
          type: string
          maxLength: 128
        token:
          type: string
          maxLength: 256
      required:
      - token
      - uid
    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/Profile'
      required:
      - user
    MyTokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    PaginatedBookList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Book'
    PasswordChange:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - current_password
      - new_password
    PasswordConfirmation:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - password
    PatchedBook:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 140
        author:
          type: string
          maxLength: 140
        year:
          type: integer
          maximum: 9999
          minimum: 1
        finished:
          type: boolean
        isbn:
          type: string
          maxLength: 32
        cover_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        notes:
          type: string
          maxLength: 10000
        rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
        started_on:
          type: string
          format: date
          nullable: true
        finished_on:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
    PatchedProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        user_name:
          type: string
          maxLength: 50
        email_verified:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
    Profile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
