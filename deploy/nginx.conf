limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
log_format safe '$remote_addr $request_method $uri $status $request_time';
server {
    listen 80;
    include /etc/nginx/trusted-gateway.conf;
    server_name _;
    access_log /var/log/nginx/access.log safe;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    root /usr/share/nginx/html;
    location ~ ^/api/(auth/(login|register|password/reset|email/resend)/|token/|register/) {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params_booktracker;
    }
    location /api/ {
        proxy_pass http://api:8000/;
        include /etc/nginx/proxy_params_booktracker;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
