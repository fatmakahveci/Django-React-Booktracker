# Optional self-hosted HTTPS gateway; add after compose.production.yaml.
services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set the public hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    networks:
      edge: {ipv4_address: 172.30.20.10}
    depends_on: [web]
  web:
    networks: [default, edge]
    volumes: ["./deploy/trusted-gateway.conf:/etc/nginx/trusted-gateway.conf:ro"]
networks:
  edge:
    ipam:
      config: [{subnet: 172.30.20.0/24}]
volumes:
  caddy_data:
  caddy_config:
